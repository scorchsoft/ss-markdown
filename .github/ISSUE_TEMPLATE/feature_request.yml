name: Feature request
description: Suggest something the app should do.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        SS Markdown's rule is "features may be deep, chrome may not be busy" (docs/product-journey.md).
        The best requests describe the job you're trying to get done rather than a button to add.
  - type: textarea
    id: job
    attributes:
      label: What are you trying to do?
      description: The task, and where the app gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
  - type: textarea
    id: alternatives
    attributes:
      label: How do you manage today?
