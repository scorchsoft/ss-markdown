<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <!--
  Strict CSP: scripts only from this bundle, nothing from the network, no
  frames, forms or plugins. 'unsafe-inline' for styles is required by KaTeX's
  inline box sizes and Mermaid's scoped SVG styles; it cannot run code.
-->
        <meta
            http-equiv="Content-Security-Policy"
            content="default-src 'none'; script-src 'self'; worker-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'none'; media-src 'none'; object-src 'none'; frame-src 'none'; child-src 'none'; form-action 'none'; base-uri 'none'"
        />
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
        <meta name="color-scheme" content="light dark" />
        <title>Preview</title>
        <style>
            /* Transparent until a theme lands, so the WebView's own background (set by
     Kotlin to the theme colour before load) shows through: no white flash. */
            html:not(.themed),
            html:not(.themed) body {
                background: transparent;
            }
        </style>
        <link rel="stylesheet" href="preview.css" />
        <script type="module" src="js/main.js"></script>
    </head>
    <body>
        <main id="doc" class="doc" aria-live="off"></main>
    </body>
</html>
